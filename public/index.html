<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#42b983">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyScheduler">
  <meta name="msapplication-TileColor" content="#2c3e50">

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico">

  <title>MyScheduler - Calendario Personal</title>

  <!-- Critical CSS inline -->
  <style>
    /* Critical CSS para mejorar el First Paint */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Avenir', Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
    }

    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #42b983;
      border-top: 3px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <noscript>
    <strong>MyScheduler requiere JavaScript para funcionar correctamente. Por favor, habilítalo para continuar.</strong>
  </noscript>

  <!-- Loading screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-spinner"></div>
  </div>

  <div id="app"></div>

  <!-- Service Worker Registration -->
  <script>
    // Detectar entorno de desarrollo
    const isDevelopment = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

    // Registrar Service Worker solo si no estamos en desarrollo o si queremos testear PWA
    if ('serviceWorker' in navigator && (!isDevelopment || location.search.includes('pwa=true'))) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registrado: ', registration);

            // Verificar actualizaciones
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Nueva versión disponible
                  if (confirm('Nueva versión disponible. ¿Recargar?')) {
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    } else if (isDevelopment) {
      console.log('Service Worker deshabilitado en desarrollo. Usa ?pwa=true para habilitarlo.');
    }

    // Ocultar loading screen cuando la app esté lista
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 300);
        }
      }, 1000);
    });
  </script>
</body>

</html>
